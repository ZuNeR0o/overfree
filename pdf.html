<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Folio · PDF</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="pdf-window">
    <div class="pdfw">
      <div class="pane-head">
        <button id="zoom-out" class="icon-btn" type="button" title="Alejar" aria-label="Alejar">−</button>
        <select id="zoom" aria-label="Zoom">
          <option value="width">Ancho</option>
          <option value="page">Página</option>
          <option value="0.75">75 %</option>
          <option value="1">100 %</option>
          <option value="1.5">150 %</option>
          <option value="2">200 %</option>
        </select>
        <button id="zoom-in" class="icon-btn" type="button" title="Acercar" aria-label="Acercar">+</button>
        <span class="grow"></span>
        <span id="page-info" class="muted"></span>
      </div>
      <div class="pdf-wrap">
        <div id="pdf-root" class="pdf-root"></div>
        <div id="empty" class="empty">
          <p class="empty-title">Esperando el PDF…</p>
          <p>Compila en la ventana principal. Doble clic en el PDF salta al código.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/pdfwindow.ts"></script>
  </body>
</html>
